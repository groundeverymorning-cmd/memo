<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #fffaf0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            padding: 40px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #1a1a1a;
            text-align: center;
            font-weight: 700;
        }

        .status-bar {
            height: 24px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
        }

        .success {
            background: #e0ffe0;
            color: #060;
            padding: 10px;
            border-radius: 8px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #ffcd00;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 205, 0, 0.1);
        }

        button {
            padding: 14px 28px;
            background: #ffcd00;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            background: #ffc000;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 205, 0, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .memos {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(135deg, #fffbf0 0%, #fffaf5 100%);
            border: 1px solid #f0e6d2;
            border-radius: 12px;
            word-break: break-word;
            transition: all 0.2s;
        }

        .memo:hover {
            background: #fff8f0;
            border-color: #ffcd00;
            box-shadow: 0 2px 8px rgba(255, 205, 0, 0.1);
        }

        .memo-text {
            flex: 1;
            color: #1a1a1a;
            font-size: 14px;
            line-height: 1.6;
        }

        .delete-btn {
            background: #ff5a5a;
            padding: 8px 14px;
            font-size: 12px;
            margin-left: 14px;
            white-space: nowrap;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #ff3333;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 50px 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 메모장</h1>
        <div id="status" class="status-bar"></div>
        <div class="input-group">
            <input
                type="text"
                id="memoInput"
                placeholder="메모를 입력하세요..."
                autocomplete="off"
            >
            <button id="addBtn">추가</button>
        </div>
        <div class="memos" id="memosList"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zzefmhesoxbvrfqdvcuh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A46fGSuL4_A5FUEqWws_HQ_M2NzkDkn';

        const memoInput = document.getElementById('memoInput');
        const addBtn = document.getElementById('addBtn');
        const memosList = document.getElementById('memosList');
        const statusDiv = document.getElementById('status');

        let supabase = null;
        let memos = [];
        let isLoading = false;

        async function initSupabase() {
            try {
                if (!window.supabase) throw new Error('Supabase library failed to load');
                
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                showStatus('✅ 연결 완료', 'success');
                await loadMemos();
            } catch (err) {
                showStatus('❌ 오류: ' + err.message, 'error');
            }
        }

        function showStatus(msg, type) {
            statusDiv.innerHTML = `<div class="${type}">${msg}</div>`;
            if (type === 'success') {
                setTimeout(() => statusDiv.innerHTML = '', 2000);
            }
        }

        async function loadMemos() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('memos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                memos = data || [];
                renderMemos();
            } catch (err) {
                showStatus('❌ 조회 실패: ' + err.message, 'error');
                memosList.innerHTML = '<div class="empty">데이터 로드 실패</div>';
            }
        }

        function renderMemos() {
            if (!memos.length) {
                memosList.innerHTML = '<div class="empty">메모가 없습니다</div>';
                return;
            }
            memosList.innerHTML = memos.map(m => `
                <div class="memo">
                    <span class="memo-text">${escapeHtml(m.content)}</span>
                    <button class="delete-btn" onclick="deleteMemo(${m.id})">삭제</button>
                </div>
            `).join('');
        }

        async function addMemo() {
            if (isLoading || !supabase) return;
            const text = memoInput.value.trim();
            if (!text) return;

            isLoading = true;
            addBtn.disabled = true;

            try {
                const { error } = await supabase
                    .from('memos')
                    .insert([{ content: text }]);

                if (error) throw error;
                memoInput.value = '';
                showStatus('✅ 추가됨', 'success');
                await loadMemos();
                memoInput.focus();
            } catch (err) {
                showStatus('❌ 추가 실패: ' + err.message, 'error');
            } finally {
                isLoading = false;
                addBtn.disabled = false;
            }
        }

        async function deleteMemo(id) {
            if (!supabase) return;
            try {
                const { error } = await supabase.from('memos').delete().eq('id', id);
                if (error) throw error;
                showStatus('✅ 삭제됨', 'success');
                await loadMemos();
            } catch (err) {
                showStatus('❌ 삭제 실패: ' + err.message, 'error');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        addBtn.addEventListener('click', addMemo);
        memoInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') addMemo();
        });

        initSupabase();
    </script>
</body>
</html>
