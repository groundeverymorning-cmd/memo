<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.12), 0 1px 2px 0 rgba(0, 0, 0, 0.24);
            padding: 0;
            overflow: hidden;
        }
        h1 {
            font-size: 32px;
            margin: 0;
            color: #202124;
            text-align: center;
            font-weight: 400;
            padding: 24px 24px 16px;
            border-bottom: 1px solid #dadce0;
        }
        .status {
            padding: 12px 24px;
            margin: 16px 24px 0;
            border-radius: 4px;
            font-size: 13px;
            border-left: 4px solid;
        }
        .status.error {
            background: #fce8e6;
            color: #c5221f;
            border-left-color: #d33b27;
        }
        .status.success {
            background: #e6f4ea;
            color: #137333;
            border-left-color: #34a853;
        }
        .input-group {
            display: flex;
            gap: 8px;
            padding: 24px;
            border-bottom: 1px solid #dadce0;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            color: #202124;
        }
        input:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }
        input::placeholder {
            color: #9aa0a6;
        }
        button {
            padding: 10px 24px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            background: #3367d6;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.12);
        }
        button:active { background: #1f56c9; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .memos {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0 24px 24px;
        }
        .memo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 4px;
            word-break: break-word;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .memo:hover {
            background: #f1f3f4;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.12);
        }
        .memo-text {
            flex: 1;
            color: #202124;
            font-size: 14px;
            line-height: 1.5;
        }
        .delete-btn {
            background: #ea4335;
            padding: 6px 16px;
            font-size: 12px;
            margin-left: 12px;
            white-space: nowrap;
            border-radius: 4px;
            color: white;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .delete-btn:hover {
            background: #d33426;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.12);
        }
        .empty {
            text-align: center;
            color: #9aa0a6;
            padding: 40px 24px;
            font-size: 14px;
        }

        /* 🎯 접근성: Screen reader only content */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* 🎯 접근성: 포커스 인디케이터 강화 */
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #4285f4;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>메모</h1>

        <!-- 🎯 접근성: 상태 메시지 - role="alert" 추가 -->
        <output id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></output>

        <div class="input-group">
            <!-- 🎯 접근성: 입력창 레이블 추가 (화면 리더용) -->
            <label for="memoInput" class="sr-only">메모 내용</label>
            <input
                type="text"
                id="memoInput"
                placeholder="메모 추가..."
                autocomplete="off"
                aria-describedby="memo-help"
            >
            <!-- 🎯 접근성: 도움말 텍스트 -->
            <span id="memo-help" class="sr-only">메모를 입력하고 추가 버튼을 누르거나 Enter를 누르세요</span>

            <button id="addBtn" aria-label="메모 추가">추가</button>
        </div>

        <!-- 🎯 접근성: 메모 목록 role 추가 -->
        <div class="memos" id="memosList" role="list" aria-label="메모 목록"></div>
    </div>

    <script>
        // 설정 (⚠️ 본 환경에서는 환경변수로 관리: process.env.SUPABASE_URL, process.env.SUPABASE_KEY)
        const SUPABASE_URL = 'https://zzefmhesoxbvrfqdvcuh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A46fGSuL4_A5FUEqWws_HQ_M2NzkDkn';

        // DOM 요소
        const memoInput = document.getElementById('memoInput');
        const addBtn = document.getElementById('addBtn');
        const memosList = document.getElementById('memosList');
        const statusDiv = document.getElementById('status');

        // 상태 변수
        let sbClient = null;
        let memoList = [];
        let loading = false;

        console.log('=== 메모 앱 시작 ===');

        // Supabase 초기화
        async function init() {
            try {
                console.log('Supabase 초기화 중...');

                if (!window.supabase) {
                    throw new Error('Supabase 라이브러리 로드 실패');
                }

                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 클라이언트 생성 완료');

                // 테이블 접근 테스트
                const { data, error } = await sbClient
                    .from('memos')
                    .select('count', { count: 'exact' })
                    .limit(1);

                if (error) {
                    console.error('❌ 테이블 접근 실패:', error.message);
                    showStatus('테이블 접근 실패: ' + error.message, 'error');
                    return;
                }

                console.log('✅ memos 테이블 접근 성공');
                showStatus('✅ Supabase 연결 완료', 'success');

                loadMemoList();
            } catch (err) {
                console.error('❌ 초기화 실패:', err.message);
                showStatus('초기화 실패: ' + err.message, 'error');
            }
        }

        // 메시지 표시 (🎯 접근성: aria-live로 자동 알림)
        function showStatus(msg, type) {
            statusDiv.innerHTML = msg;
            statusDiv.className = type;
            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.innerHTML = '';
                    statusDiv.className = '';
                }, 2000);
            }
        }

        // 메모 목록 로드
        async function loadMemoList() {
            if (!sbClient) return;

            try {
                console.log('메모 조회 중...');
                const { data, error } = await sbClient
                    .from('memos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                memoList = data || [];
                console.log('✅ 메모 조회 완료:', memoList.length, '개');
                renderList();
            } catch (err) {
                console.error('❌ 조회 실패:', err.message);
                showStatus('조회 실패: ' + err.message, 'error');
            }
        }

        // 메모 목록 렌더링
        function renderList() {
            if (memoList.length === 0) {
                memosList.innerHTML = '<div class="empty">메모가 없습니다</div>';
                return;
            }

            // 🎯 접근성: role="listitem" 추가
            memosList.innerHTML = memoList.map(item => `
                <div class="memo" role="listitem">
                    <span class="memo-text">${escapeHTML(item.content)}</span>
                    <button class="delete-btn" onclick="deleteMemoItem(${item.id})" aria-label="메모 삭제: ${escapeHTML(item.content).substring(0, 20)}...">삭제</button>
                </div>
            `).join('');
        }

        // 메모 추가
        async function addMemo() {
            if (loading || !sbClient) return;

            const text = memoInput.value.trim();
            if (!text) return;

            loading = true;
            addBtn.disabled = true;

            try {
                console.log('메모 추가 중...');
                const { error } = await sbClient
                    .from('memos')
                    .insert([{ content: text }]);

                if (error) throw error;

                console.log('✅ 메모 추가 완료');
                memoInput.value = '';
                showStatus('✅ 추가됨', 'success');
                await loadMemoList();
                memoInput.focus();
            } catch (err) {
                console.error('❌ 추가 실패:', err.message);
                showStatus('추가 실패: ' + err.message, 'error');
            } finally {
                loading = false;
                addBtn.disabled = false;
            }
        }

        // 메모 삭제
        async function deleteMemoItem(id) {
            if (!sbClient) return;

            // 🔒 삭제 확인 대화 - 실수 방지
            if (!confirm('이 메모를 정말 삭제하시겠습니까?')) {
                console.log('삭제 취소됨');
                return;
            }

            try {
                console.log('메모 삭제 중, ID:', id);
                const { error } = await sbClient
                    .from('memos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                console.log('✅ 메모 삭제 완료');
                showStatus('✅ 삭제됨', 'success');
                await loadMemoList();
            } catch (err) {
                console.error('❌ 삭제 실패:', err.message);
                showStatus('삭제 실패: ' + err.message, 'error');
            }
        }

        // XSS 방지
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 이벤트 리스너
        addBtn.addEventListener('click', addMemo);
        memoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addMemo();
        });

        // 페이지 로드 완료 후 초기화
        init();
    </script>
</body>
</html>
