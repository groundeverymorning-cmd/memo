<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모장</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #fffaf0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            padding: 40px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #1a1a1a;
            text-align: center;
            font-weight: 700;
        }
        .status { padding: 10px; margin-bottom: 20px; border-radius: 8px; font-size: 12px; }
        .status.error { background: #ffe0e0; color: #c00; }
        .status.success { background: #e0ffe0; color: #060; }
        .input-group { display: flex; gap: 12px; margin-bottom: 30px; }
        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            background: #fafafa;
        }
        input:focus { outline: none; border-color: #ffcd00; background: white; box-shadow: 0 0 0 4px rgba(255, 205, 0, 0.1); }
        button {
            padding: 14px 28px;
            background: #ffcd00;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }
        button:hover:not(:disabled) { background: #ffc000; transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .memos { display: flex; flex-direction: column; gap: 10px; }
        .memo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: linear-gradient(135deg, #fffbf0 0%, #fffaf5 100%);
            border: 1px solid #f0e6d2;
            border-radius: 12px;
            word-break: break-word;
        }
        .memo:hover { background: #fff8f0; border-color: #ffcd00; }
        .memo-text { flex: 1; color: #1a1a1a; font-size: 14px; line-height: 1.6; }
        .delete-btn {
            background: #ff5a5a;
            padding: 8px 14px;
            font-size: 12px;
            margin-left: 14px;
            white-space: nowrap;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .delete-btn:hover { background: #ff3333; }
        .empty { text-align: center; color: #aaa; padding: 50px 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 메모장</h1>
        <div id="status"></div>
        <div class="input-group">
            <input type="text" id="memoInput" placeholder="메모를 입력하세요..." autocomplete="off">
            <button id="addBtn">추가</button>
        </div>
        <div class="memos" id="memosList"></div>
    </div>

    <script>
        // 설정
        const SUPABASE_URL = 'https://zzefmhesoxbvrfqdvcuh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A46fGSuL4_A5FUEqWws_HQ_M2NzkDkn';

        // DOM 요소
        const memoInput = document.getElementById('memoInput');
        const addBtn = document.getElementById('addBtn');
        const memosList = document.getElementById('memosList');
        const statusDiv = document.getElementById('status');

        // 상태 변수
        let sbClient = null;
        let memoList = [];
        let loading = false;

        console.log('=== 메모 앱 시작 ===');

        // Supabase 초기화
        async function init() {
            try {
                console.log('Supabase 초기화 중...');

                if (!window.supabase) {
                    throw new Error('Supabase 라이브러리 로드 실패');
                }

                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log('✅ Supabase 클라이언트 생성 완료');

                // 테이블 접근 테스트
                const { data, error } = await sbClient
                    .from('memos')
                    .select('count', { count: 'exact' })
                    .limit(1);

                if (error) {
                    console.error('❌ 테이블 접근 실패:', error.message);
                    showStatus('테이블 접근 실패: ' + error.message, 'error');
                    return;
                }

                console.log('✅ memos 테이블 접근 성공');
                showStatus('✅ Supabase 연결 완료', 'success');

                loadMemoList();
            } catch (err) {
                console.error('❌ 초기화 실패:', err.message);
                showStatus('초기화 실패: ' + err.message, 'error');
            }
        }

        // 메시지 표시
        function showStatus(msg, type) {
            statusDiv.innerHTML = `<div class="status ${type}">${msg}</div>`;
            if (type === 'success') {
                setTimeout(() => { statusDiv.innerHTML = ''; }, 2000);
            }
        }

        // 메모 목록 로드
        async function loadMemoList() {
            if (!sbClient) return;

            try {
                console.log('메모 조회 중...');
                const { data, error } = await sbClient
                    .from('memos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                memoList = data || [];
                console.log('✅ 메모 조회 완료:', memoList.length, '개');
                renderList();
            } catch (err) {
                console.error('❌ 조회 실패:', err.message);
                showStatus('조회 실패: ' + err.message, 'error');
            }
        }

        // 메모 목록 렌더링
        function renderList() {
            if (memoList.length === 0) {
                memosList.innerHTML = '<div class="empty">메모가 없습니다</div>';
                return;
            }

            memosList.innerHTML = memoList.map(item => `
                <div class="memo">
                    <span class="memo-text">${escapeHTML(item.content)}</span>
                    <button class="delete-btn" onclick="deleteMemoItem(${item.id})">삭제</button>
                </div>
            `).join('');
        }

        // 메모 추가
        async function addMemo() {
            if (loading || !sbClient) return;

            const text = memoInput.value.trim();
            if (!text) return;

            loading = true;
            addBtn.disabled = true;

            try {
                console.log('메모 추가 중...');
                const { error } = await sbClient
                    .from('memos')
                    .insert([{ content: text }]);

                if (error) throw error;

                console.log('✅ 메모 추가 완료');
                memoInput.value = '';
                showStatus('✅ 추가됨', 'success');
                await loadMemoList();
                memoInput.focus();
            } catch (err) {
                console.error('❌ 추가 실패:', err.message);
                showStatus('추가 실패: ' + err.message, 'error');
            } finally {
                loading = false;
                addBtn.disabled = false;
            }
        }

        // 메모 삭제
        async function deleteMemoItem(id) {
            if (!sbClient) return;

            try {
                console.log('메모 삭제 중, ID:', id);
                const { error } = await sbClient
                    .from('memos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                console.log('✅ 메모 삭제 완료');
                showStatus('✅ 삭제됨', 'success');
                await loadMemoList();
            } catch (err) {
                console.error('❌ 삭제 실패:', err.message);
                showStatus('삭제 실패: ' + err.message, 'error');
            }
        }

        // XSS 방지
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 이벤트 리스너
        addBtn.addEventListener('click', addMemo);
        memoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addMemo();
        });

        // 페이지 로드 완료 후 초기화
        init();
    </script>
</body>
</html>
